# 只构建与校验独立脱敏副本，不对源码库运行完整发行验证器。
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装锁定依赖
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 类型检查、合成测试与应用契约
        run: |
          bun run typecheck
          bun test
          bun run verify:app

      - name: 安装合成浏览器验收环境
        run: bun x playwright install --with-deps chromium

      - name: 浏览器交互验收
        run: bun run verify:browser

      - name: 构建并恢复验证独立发行候选
        run: |
          bun scripts/build_template.ts --out "$RUNNER_TEMP/personal-life-os-output" --name Personal-Life-OS-ci --version 2.0.0 --zip
          bun scripts/verify_template.ts "$RUNNER_TEMP/personal-life-os-output/Personal-Life-OS-ci"
          bun scripts/verify_archive_restore.ts "$RUNNER_TEMP/personal-life-os-output/Personal-Life-OS-ci-template-v2.0.0.zip"
